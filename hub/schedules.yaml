  - name: skill-radar-weekly
    agent: coach
    runtime: cloud
    owner: routine
    routine_id: trig_01X1kLP2VXovieFS6S5tgKyS
    cron: "0 8 * * 1"
    evidence: none

  - name: skill-radar-monthly
    agent: coach
    runtime: cloud
    owner: routine
    routine_id: trig_01HmaWEW6C672nNfU6PFWyzB
    cron: "0 9 1 * *"
    evidence: none

  - name: weekly-review
    agent: hub
    runtime: cloud
    owner: routine
    routine_id: trig_01B3cS1od3EwgBB76a9dEcPe
    cron: "0 20 * * 0"
    evidence: {vault: "Projects/Weekly Reports and CTA/*.md"}
    grace_minutes: 120

  - name: missed-run-check
    agent: hub
    runtime: laptop
    cron: "0 9,13,21 * * *"
    evidence: none
    notes: python -m hub schedule check --email; emails the list when something was missed
