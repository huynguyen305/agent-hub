[project]
name = "hubkit"
version = "0.1.0"
description = "Shared platform for the Agent Hub: LLM providers and routing, usage ledger, guardrails, GraphRAG vault knowledge, vault writer, GenUI, Jev evals."
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1.7",
  "pydantic>=2.7",
  "pyyaml>=6",
  "claude-agent-sdk>=0.2",
  "guardrails-ai>=0.11",
  "httpx>=0.27",
]

[project.optional-dependencies]
api = ["anthropic>=0.40"]
dev = ["pytest>=8"]
# vault knowledge base (GraphRAG). On Windows install torch CPU-only first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
kb = [
  "langchain-graph-retriever[chroma]>=0.8,<0.9",
  "langchain-chroma>=1.1",
  "chromadb>=1.5",
  "langchain-huggingface>=1.2",
  "sentence-transformers>=5",
  "python-dateutil>=2.8.2,<3",
]
agents = ["langgraph>=1.2"]
ui = ["streamlit>=1.40", "pandas>=2.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hubkit*", "hub*", "channels*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
